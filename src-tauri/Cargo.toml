[package]
name = "neongit"
version = "0.1.0"
description = "Open source visual Git client"
authors = ["wesleyfariasdev"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "neongit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
